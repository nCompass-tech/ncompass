# Base docker-compose configuration for nCompass unified image
# Individual examples extend this with their service name
#
# Usage in example docker-compose.yaml:
#   services:
#     my_example:
#       extends:
#         file: ../docker/docker-compose.base.yaml
#         service: ncompass
#       container_name: my_example

x-ncompass-common: &ncompass-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      - HOST_UID=${UID:-1000}
      - HOST_GID=${GID:-1000}
      - VLLM_NIGHTLY=${VLLM_NIGHTLY:-0}
      - PYTHON_VERSION=${PYTHON_VERSION:-3.10}
  image: ncompass-examples:latest
  privileged: true
  network_mode: host
  ipc: host
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  volumes:
    - ${HOME}:${HOME}
  working_dir: ${CURRENT_DIR}
  environment:
    - HOST_UID=${UID:-1000}
    - HOST_GID=${GID:-1000}
    - DISPLAY=${DISPLAY:-:0}
    - HOME=${HOME}
    - HF_TOKEN=${HF_TOKEN:-}
    - VLLM_TORCH_PROFILER_DIR=${VLLM_TORCH_PROFILER_DIR:-}
    - LD_LIBRARY_PATH=/usr/local/cuda/lib:/usr/local/cuda/lib64
  stdin_open: true
  tty: true
  command: sleep infinity

services:
  ncompass:
    <<: *ncompass-common
